# main へのプッシュで静的ビルド(out/)を Cloudflare Pages へ公開する。
# 公開URL: https://opus093-site.pages.dev
#
# 必要な GitHub Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  … Cloudflare で発行するAPIトークン(権限: Cloudflare Pages - Edit)
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare ダッシュボード右側に表示されるアカウントID
#
# NEXT_PUBLIC_BASE_PATH は意図的に設定しない。
# Cloudflare ではルート直下配信のため、サブパスを付けるとアセットが404になる。
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  CF_PROJECT_NAME: opus093-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_OUTPUT: export

      # 初回デプロイ時にプロジェクトを自動作成する。2回目以降は既存のため失敗するので無視。
      - name: Ensure Cloudflare Pages project exists
        run: |
          npx --yes wrangler@4 pages project create "$CF_PROJECT_NAME" \
            --production-branch main \
          || echo "Pages project already exists — skipping creation"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy out \
            --project-name "$CF_PROJECT_NAME" \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
