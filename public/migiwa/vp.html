<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03141b">
<title>ビューポート計測 — 汀ノ庭</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box}
  html,body{height:100%; background:#03141b; color:#eaf6f8;
    font:500 13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace; -webkit-text-size-adjust:100%}
  /* 全面の格子。端まで描けているかを目で見る。
     40px ごとの線 + 四隅の直角マーク。バーの裏まで続いていれば
     「線がバーの下から出てくる」ように見える。 */
  #bleed{position:fixed; inset:0; z-index:0;
    background:
      repeating-linear-gradient(90deg, rgba(143,212,222,.16) 0 1px, transparent 1px 40px),
      repeating-linear-gradient(0deg,  rgba(143,212,222,.16) 0 1px, transparent 1px 40px),
      linear-gradient(160deg, #0b2b38 0%, #03141b 60%, #0a2230 100%);
  }
  .corner{position:fixed; z-index:1; width:56px; height:56px; border:3px solid #ff5d5d}
  .tl{top:0; left:0; border-right:0; border-bottom:0}
  .tr{top:0; right:0; border-left:0; border-bottom:0}
  .bl{bottom:0; left:0; border-right:0; border-top:0}
  .br{bottom:0; right:0; border-left:0; border-top:0}
  /* 安全域そのものを塗る。ここが「バーやノッチに隠れる」とOSが言っている帯。 */
  .safe{position:fixed; z-index:1; background:rgba(255,93,93,.30); pointer-events:none}
  #sT{top:0; left:0; right:0; height:env(safe-area-inset-top)}
  #sB{bottom:0; left:0; right:0; height:env(safe-area-inset-bottom)}
  #panel{position:fixed; z-index:2; left:50%; top:12px; transform:translateX(-50%);
    width:min(94vw,380px); max-height:calc(100% - 24px); overflow:auto;
    background:rgba(2,14,20,.94); border:1px solid rgba(143,212,222,.35);
    border-radius:10px; padding:12px 13px; font-size:12px}
  h1{font-size:12px; letter-spacing:.18em; color:#8fd4de; margin-bottom:10px; font-weight:600}
  tr td{padding:2px 0; vertical-align:top}
  td.k{color:#8fd4de; padding-right:10px; white-space:nowrap}
  td.v{font-variant-numeric:tabular-nums}
  .note{margin-top:10px; font-size:11px; line-height:1.6; color:#9fb8c0}
  b.hit{color:#ff9b9b}
</style>
</head>
<body>
<div id="bleed"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>
<div class="safe" id="sT"></div><div class="safe" id="sB"></div>
<div id="panel">
  <h1>VIEWPORT — このまま撮って送ってください</h1>
  <table id="t"></table>
  <p class="note">赤い直角が四隅に見えていれば、ページは画面の端まで届いています。<br>
  赤い帯は、OSが「隠れる」と言っている範囲です。</p>
</div>
<script>
  const px = n => (n == null ? '—' : Math.round(n * 10) / 10 + '');
  const cssEnv = side => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;visibility:hidden;height:env(safe-area-inset-' + side + ')';
    document.body.appendChild(d);
    const v = parseFloat(getComputedStyle(d).height) || 0;
    d.remove(); return v;
  };
  function render(){
    const vv = visualViewport;
    const hiddenBottom = vv ? Math.max(0, innerHeight - (vv.height + vv.offsetTop)) : null;
    /* ★ ここが本丸。
       ズーム = 画面の実寸(pt) ÷ ページのCSS幅。1.00 でなければ縮小/拡大表示。
       cover = ページが取れる最大の高さ(100lvh)を実寸に直して、画面の高さに
               届いているか。届いていなければ viewport-fit=cover が効いておらず、
               ページはバーの内側に切られている = CSSでは裏に描けない。 */
    const zoom = screen.width / innerWidth;
    const lvhPt = lvh() * zoom;
    const reach = lvhPt / screen.height;
    const coverOn = reach > 0.985;
    const rows = [
      ['<b class="' + (Math.abs(zoom-1) < 0.02 ? '' : 'hit') + '">ズーム</b>',
       '<b class="' + (Math.abs(zoom-1) < 0.02 ? '' : 'hit') + '">' + Math.round(zoom*100) + '%</b>'
       + (Math.abs(zoom-1) < 0.02 ? '' : '  ← 100%ではない')],
      ['<b class="' + (coverOn ? '' : 'hit') + '">cover 有効</b>',
       '<b class="' + (coverOn ? '' : 'hit') + '">' + (coverOn ? 'はい' : 'いいえ') + '</b>'
       + '  (' + Math.round(lvhPt) + 'pt / ' + screen.height + 'pt = ' + Math.round(reach*100) + '%)'],
      ['画面 screen',        screen.width + ' x ' + screen.height],
      ['inner',              innerWidth + ' x ' + innerHeight],
      ['visualViewport',     vv ? px(vv.width) + ' x ' + px(vv.height) : 'なし'],
      ['vv.offsetTop',       vv ? px(vv.offsetTop) : '—'],
      ['vv.scale',           vv ? px(vv.scale) : '—'],
      ['下に隠れている量',   hiddenBottom === null ? '—'
                             : (hiddenBottom > 0 ? '<b class="hit">' + px(hiddenBottom) + '</b>' : '0  ← バーは画面を縮めていない')],
      ['safe top',           px(cssEnv('top'))],
      ['safe bottom',        px(cssEnv('bottom'))],
      ['safe left / right',  px(cssEnv('left')) + ' / ' + px(cssEnv('right'))],
      ['100dvh / 100lvh',    dvh() + ' / ' + lvh()],
      ['dpr',                px(devicePixelRatio)],
      ['standalone',         (navigator.standalone === true ||
                              matchMedia('(display-mode: standalone)').matches) ? 'はい' : 'いいえ'],
      ['<b class="hit">UA(全文)</b>', '<span style="word-break:break-all">'
                             + navigator.userAgent + '</span>'],
      ['ブラウザ判定',       (() => {
        const u = navigator.userAgent;
        if (/CriOS/.test(u))  return 'Chrome for iOS';
        if (/FxiOS/.test(u))  return 'Firefox for iOS';
        if (/EdgiOS/.test(u)) return 'Edge for iOS';
        /* Safari 本体は必ず "Version/x.y ... Safari/" を名乗る。
           これが無い WebKit は アプリ内ブラウザ(WKWebView)。 */
        if (/Version\/[\d.]+.*Safari/.test(u)) return 'Safari 本体';
        return '<b class="hit">アプリ内ブラウザ(WKWebView)の可能性</b>';
      })()],
    ];
    document.getElementById('t').innerHTML =
      rows.map(r => '<tr><td class="k">' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>').join('');
  }
  function unit(u){
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;visibility:hidden;height:100' + u;
    document.body.appendChild(d);
    const v = parseFloat(getComputedStyle(d).height) || 0;
    d.remove(); return Math.round(v);
  }
  const dvh = () => unit('dvh'), lvh = () => unit('lvh');
  render();
  addEventListener('resize', render, { passive:true });
  if (visualViewport){
    visualViewport.addEventListener('resize', render, { passive:true });
    visualViewport.addEventListener('scroll', render, { passive:true });
  }
</script>
</body>
</html>
